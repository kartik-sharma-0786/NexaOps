name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check migration drift
        run: |
          cd packages/database
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Drizzle schema changed without a committed migration. Run 'pnpm db:generate' in packages/database and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

      # Apps/API Tests
      - name: Test API
        run: |
          cd apps/api
          pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nexaops
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nexaops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexaops -d nexaops_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    env:
      DATABASE_URL: postgres://nexaops:password@localhost:5432/nexaops_db
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      NOTIFICATIONS_QUEUE_ENABLED: "true"
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm --filter @nexaops/database db:migrate

      - name: Seed database
        run: pnpm --filter @nexaops/database db:seed

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Start API
        run: |
          cd apps/api
          nohup node dist/main.js > ../../api.log 2>&1 &

      - name: Start Web
        run: |
          cd apps/web
          nohup pnpm start > ../../web.log 2>&1 &

      - name: Wait for services
        run: npx wait-on --timeout 120000 http://localhost:4000/health http://localhost:3000

      - name: Run Playwright tests
        run: pnpm --filter web test:e2e
        env:
          E2E_FULL_STACK: "true"

      - name: Print service logs on failure
        if: failure()
        run: |
          echo "--- api.log ---"; cat api.log || true
          echo "--- web.log ---"; cat web.log || true
