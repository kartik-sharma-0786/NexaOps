name: Deploy Database Changes

on:
  push:
    branches:
      - main
    paths:
      - "packages/database/**"

jobs:
  deploy-db:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm --filter @nexaops/database db:migrate

      - name: Skipped (no DATABASE_URL secret)
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "Skipping migration — set the DATABASE_URL repository secret to enable automatic DB deploys."
